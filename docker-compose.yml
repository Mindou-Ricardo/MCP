services:
  backend:
    build:
      context: ./backend
    container_name: mcp-backend
    env_file:
      - .env
    environment:
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - CORS_ORIGINS=http://localhost:5173,http://localhost
    volumes:
      - generated_servers:/app/generated-servers
    networks:
      - mcp-net
    ports:
      - "8000:8000"
    depends_on:
      - litellm-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: mcp-frontend
    networks:
      - mcp-net
    ports:
      - "8080:80"
    depends_on:
      - backend

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: mcp-litellm
    env_file:
      - .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - mcp-net
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: mcp-db
    environment:
      - POSTGRES_USER=mcp
      - POSTGRES_PASSWORD=mcp
      - POSTGRES_DB=mcp
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mcp-net
    profiles: ["postgres"]

networks:
  mcp-net:
    driver: bridge

volumes:
  generated_servers:
  db_data: